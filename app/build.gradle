plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'local.firetv.home'
    compileSdk 30
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'local.firetv.home'
        minSdk 30
        targetSdk 30
        versionCode 2
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            manifestPlaceholders.launcherLabel = 'Streaming Home Dev'
        }
        release {
            manifestPlaceholders.launcherLabel = 'Streaming Home'
            minifyEnabled false
        }
    }

    lint {
        // This APK is sideloaded on Fire OS and retains the tested API 30 behavior.
        disable "ExpiredTargetSdkVersion"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
